# Builds the Windows installer of the editor app ("Starbushway Editor Setup x.y.z.exe").
# Run it by hand (Actions → "Editor-Programm bauen" → Run workflow) or push a tag such as
# editor-v0.1.0, which also attaches the installer to a GitHub release.
name: Editor-Programm bauen

on:
  workflow_dispatch:
  push:
    tags: ['editor-v*']

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
        working-directory: editor
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: editor/package-lock.json

      - name: Abhängigkeiten installieren
        run: npm ci

      # The same Hugo version that builds the website, so the preview matches it exactly.
      - name: Hugo für die Vorschau holen
        run: bash scripts/fetch-hugo.sh windows

      - name: Bauen und testen
        run: |
          npm run build
          npm test

      - name: Installationsprogramm erstellen
        run: npx electron-builder --win nsis --x64 --publish never

      - uses: actions/upload-artifact@v4
        with:
          name: Starbushway-Editor-Windows
          path: editor/release/*.exe

      - name: Release anlegen
        if: startsWith(github.ref, 'refs/tags/editor-v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" release/*.exe --title "Starbushway Editor ${GITHUB_REF_NAME#editor-v}" --notes "Installationsprogramm für Windows."
