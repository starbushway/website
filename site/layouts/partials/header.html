<header class="kopf">
  <div class="kopf-zeile">
    <a class="logo" href="/"><img src="/theme/logo.gif" width="500" height="75" alt="Starbushway – zur Startseite"></a>
    <button class="menue-knopf" type="button" aria-expanded="false" aria-controls="hauptmenue">Menü</button>
  </div>
  <nav id="hauptmenue" class="hauptmenue" aria-label="Hauptmenü">
    <ul>
      <li><a href="/"{{ if .IsHome }} aria-current="page"{{ end }}>Startseite</a></li>
      {{- $current := . }}
      {{- range site.Menus.main }}
      <li><a href="{{ .URL }}"{{ if $current.IsMenuCurrent "main" . }} aria-current="page"{{ else if $current.HasMenuCurrent "main" . }} aria-current="true"{{ end }}>{{ .Name }}</a></li>
      {{- end }}
    </ul>
  </nav>
</header>
{{ if not .IsHome }}
<nav class="brotkrumen" aria-label="Sie sind hier">
  <ol>
    {{- range .Ancestors.Reverse }}
    <li><a href="{{ .RelPermalink }}">{{ if .IsHome }}Startseite{{ else }}{{ .LinkTitle }}{{ end }}</a></li>
    {{- end }}
    <li aria-current="page">{{ .LinkTitle }}</li>
  </ol>
</nav>
{{ end }}
