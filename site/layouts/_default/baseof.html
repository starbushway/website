<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ if .IsHome }}{{ site.Title }}{{ else }}{{ .Title }} – Starbushway{{ end }}</title>
  <meta name="description" content="{{ with .Description }}{{ . }}{{ else }}{{ site.Params.description }}{{ end }}">
  <meta name="color-scheme" content="light">
  <link rel="canonical" href="{{ .Permalink }}">
  {{ with resources.Get "css/main.css" | minify | fingerprint }}<link rel="stylesheet" href="{{ .RelPermalink }}" integrity="{{ .Data.Integrity }}">{{ end }}
  <script>document.documentElement.classList.add("js")</script>
</head>
<body{{ if .IsHome }} class="startseite"{{ end }}>
  <a class="sprung" href="#inhalt">Zum Inhalt springen</a>
  {{ partial "header.html" . }}
  <main id="inhalt" class="inhalt">
    {{ block "main" . }}{{ end }}
  </main>
  {{ partial "footer.html" . }}
  {{ with resources.Get "js/menue.js" | minify | fingerprint }}<script src="{{ .RelPermalink }}" integrity="{{ .Data.Integrity }}" defer></script>{{ end }}
</body>
</html>
